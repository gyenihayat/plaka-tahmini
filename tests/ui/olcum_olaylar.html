<!-- Analitik olay bağlantılarını (PlakaOlcum.kayit; son 50 olayı tutar, bu yüzden her işlemden önce boşaltılır) ve engelleme korumasını gerçek tarayıcıda sınar. Test ortamında olcum.js hiçbir şey göndermez (host plakatahmini.com değil). tests/test_olcum.py kullanır. -->
<!doctype html><meta charset="utf-8"><body><pre id="o">çalışıyor</pre><div id="k"></div>
<script>
const SAYFALAR = __SAYFALAR__, ESLIK = __ESLIK__, TAKMA = __TAKMA__, out = {sayfalar: [], il: {}, ana: {}, engel: {}};
function yukle(src) { return new Promise(r => { const f = document.createElement("iframe"); f.style.cssText = "width:900px;height:700px;border:0"; f.onload = () => setTimeout(() => r(f), 80); f.src = src; document.getElementById("k").appendChild(f); }); }
const ev = (f, e) => f.contentWindow.eval(e);
(async () => {
  // 0) engelleme: GoatCounter ve Abacus adresleri bu tarayıcıdan ulaşılamaz (yalnızca okuma/statik adresler denenir)
  for (const [ad, url] of [["gc.zgo.at", "https://gc.zgo.at/count.js"], ["goatcounter.com", "https://plakatahmini.goatcounter.com/"], ["abacus", "https://abacus.jasoncameron.dev/get/plaka-tahmini-vercel/ziyaret"]]) {
    out.engel[ad] = await fetch(url, {mode: "no-cors"}).then(() => "ULASILDI", () => "engelli");
  }
  // 1) 82 sayfa: olcum.js yüklü, üretim dışında çalışmıyor, GoatCounter betiği DOM'a eklenmemiş
  for (const s of SAYFALAR) {
    const f = await yukle(s);
    out.sayfalar.push({s, tur: ev(f, "typeof PlakaOlcum"), uygun: ev(f, "PlakaOlcum.uygun()"), gc: !!f.contentWindow.document.querySelector("script[data-goatcounter]"), gcNesne: ev(f, "typeof window.goatcounter"), kayit: ev(f, "PlakaOlcum.kayit.length")});
    f.remove();
  }
  // 2) il sayfası: hesaplayıcı olayları (başarısız işlem: mevcut toplam hata olayı + tek sabit kategori olayı)
  { const f = await yukle("/il/konya"), w = f.contentWindow, d = w.document, form = d.getElementById("hedef-form"), g = (v, ex) => { d.getElementById("hedef").value = v; d.getElementById("atla").value = ex || ""; ev(f, "PlakaOlcum.kayit.length = 0"); form.dispatchEvent(new w.Event("submit", {cancelable: true})); return ev(f, "PlakaOlcum.kayit.slice()"); };
    out.il = {gecerli: g("BZZ 999"), gecersiz: g("IAA"), bos: g(""), baska: g("06 GAA"), kod: g("99 AAA"), dislanan: g("BZZ 999", "BXX"), yok: g("BZZ 999", "SXY"),
              tek: g("B"), iki: g("42 AB 1234"), format: g("ABC 1234"), karakterTR: g("ŞAA"), bosluk: g("   ")};
    out.il.metin = d.getElementById("sonuc").textContent; f.remove(); }
  // 3) ana sayfa: hesaplayıcı (gerçek calcTarget), il araması, kartlar
  { const f = await yukle("/"), w = f.contentWindow, d = w.document, gi = id => d.getElementById(id), kayit = () => ev(f, "PlakaOlcum.kayit.slice()");
    const sur = (v, enter) => { ev(f, "PlakaOlcum.kayit.length = 0"); gi("target").value = v; if (enter) gi("target").dispatchEvent(new w.KeyboardEvent("keydown", {key: "Enter", bubbles: true})); else gi("btn-target").click(); return kayit(); };
    out.ana.hesapla = {gecerli: sur("BZZ 999"), gecersiz: sur("IAA"), enter: sur("BZZ 999", true), enterHata: sur("IAA", true),
                       bos: sur(""), tek: sur("S"), iki: sur("34 AB 1234"), format: sur("ABC 1234"), karakterTR: sur("ŞAA"), ilKodu: sur("99 AAA"), digerIl: sur("06 GAA")};
    // calcTarget ile eşlik: her girdide sonuç kutusunun durumu, gösterilen uyarı ve olaylar (Python tarafı: gizli <-> tek kategori, kategori <-> uyarı)
    out.ana.eslik = ESLIK.map(v => { const ol = sur(v); return {v, ol, gizli: gi("target-res").style.display === "none", warn: gi("target-warn").style.display === "none" ? "" : gi("target-warn").textContent}; });
    const gir = v => { ev(f, "PlakaOlcum.kayit.length = 0"); gi("il-ara").value = v; gi("il-form").dispatchEvent(new w.Event("submit", {cancelable: true})); return kayit(); };
    out.ana.araHata = gir("k"); out.ana.araBos = gir(""); out.ana.araBosluk = gir("   "); out.ana.araYok = gir("82"); out.ana.araAnlamsiz = gir("xyz"); out.ana.araCelisik = gir("konya 06");
    out.ana.araMesaj = gi("il-hata").textContent; f.remove(); }
  { const f = await yukle("/"), w = f.contentWindow, d = w.document; d.getElementById("il-ara").value = "Konya"; d.getElementById("il-form").dispatchEvent(new w.Event("submit", {cancelable: true})); out.ana.araBasari = ev(f, "PlakaOlcum.kayit.slice()"); f.remove(); }
  // 4) il araması: alternatif adlar gerçek tarayıcıda doğru il sayfasına gider (masaüstü genişliği; mobil: ana_yerlesim.html)
  out.ana.takma = {};
  for (const v of TAKMA) {
    const f = await yukle("/"), w = f.contentWindow, d = w.document; d.getElementById("il-ara").value = v;
    const yol = new Promise(res => { f.addEventListener("load", () => res(f.contentWindow.location.pathname), {once: true}); setTimeout(() => res("gecis-yok"), 3000); });
    d.getElementById("il-form").dispatchEvent(new w.Event("submit", {cancelable: true})); const ol = ev(f, "PlakaOlcum.kayit.slice()");
    out.ana.takma[v] = {ol, yol: await yol}; f.remove();
  }
  out.ana.kartlar = [];
  for (const sl of ["istanbul", "ankara", "izmir"]) { const f = await yukle("/"), d = f.contentWindow.document; d.querySelector('.kart[href="/il/' + sl + '"]').click(); out.ana.kartlar.push(ev(f, "PlakaOlcum.kayit.slice()")); f.remove(); }
  document.getElementById("o").textContent = "SONUC " + JSON.stringify(out);
})();
</script>
