<!-- Ana sayfadaki "81 ilin bu tarihteki tahminleri" tablosunu okur (hız ve seri süresi sütunları): tests/test_hiz_tutarliligi.py kullanır. -->
<!doctype html><meta charset="utf-8"><body><iframe id="f" src="/" width="900" height="900"></iframe><pre id="o">çalışıyor</pre>
<script>
document.getElementById("f").addEventListener("load", () => setTimeout(() => {
  const w = document.getElementById("f").contentWindow, d = w.document, g = id => d.getElementById(id), out = {baslangicKapali: g("all-wrap").hidden, tablo: null};
  g("btn-all").click(); const t = g("all-tbl");
  out.tablo = {basliklar: [...t.rows[0].cells].map(c => c.textContent), satirlar: [...t.rows].slice(1).map(r => [...r.cells].map(c => c.textContent))};
  document.getElementById("o").textContent = "SONUC " + JSON.stringify(out);
}, 200));
</script>
